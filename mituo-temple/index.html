<canvas id="scene" aria-label="彌陀古寺 3D 場景"></canvas>
<div class="grain" aria-hidden="true"></div>
<header class="title">
  <p class="eyebrow">阿彌陀佛道場</p>
  <h1>彌陀古寺<span>大殿共修</span></h1>
  <p class="lede">大雄寶殿內鋪滿榻榻米，金身阿彌陀佛端坐蓮台。方丈、師父、大小沙彌與信眾跪在拜墊上，合掌念佛、問訊禮拜、五體投地。</p>
  <p class="credit">出自於 Irene Yeh</p>
</header>
<nav class="chips" aria-label="鏡頭">
  <button class="chip" data-view="hall" aria-pressed="true">殿內</button>
  <button class="chip" data-view="buddha">佛前</button>
  <button class="chip" data-view="abbot">方丈</button>
  <button class="chip" data-view="novice">小沙彌</button>
  <button class="chip" data-view="lay">信眾</button>
  <button class="chip" data-view="door">殿門外</button>
</nav>
<div class="console">
  <button id="play" class="round" aria-label="播放">▶</button>
  <div class="track">
    <div class="readout"><span id="stage">大地與山林</span><span id="pct">0%</span></div>
    <input id="range" type="range" min="0" max="1000" value="0" aria-label="建造進度">
  </div>
  <button id="sound" class="pill" aria-pressed="false">♪ 開啟音效</button>
  <button id="chantBtn" class="pill" aria-pressed="true">念佛聲</button>
  <button id="rebuild" class="pill ghost">重新建寺</button>
</div>
